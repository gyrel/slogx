name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Release module
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Verify module
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...

      - name: Install pinned SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      - name: Generate SBOM
        run: |
          cyclonedx-gomod mod -licenses -json -output sbom.cdx.json .
          sha256sum sbom.cdx.json > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            sbom.cdx.json SHA256SUMS
